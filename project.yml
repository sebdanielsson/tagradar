name: Tagradar
options:
  bundleIdPrefix: se.tagradar
  deploymentTarget:
    iOS: "26.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  groupSortPosition: top
  defaultConfig: Debug
configs:
  Debug: debug
  Release: release
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_UPCOMING_FEATURE_EXISTENTIAL_ANY: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: "$(DEVELOPMENT_TEAM)"
    # Bundle identifier prefix. The release build uses se.tagradar.app; a developer on another Apple
    # team sets APP_BUNDLE_ID in Config/Secrets.xcconfig (via .env.local), because bundle IDs and App
    # Groups are unique across teams and cannot be registered twice.
    TAGRADAR_BUNDLE_ID: "$(APP_BUNDLE_ID:default=se.tagradar.app)"
    # Bumped by release-please (see release-please-config.json); CI stamps the build number.
    MARKETING_VERSION: 1.0.0 # x-release-please-version
    CURRENT_PROJECT_VERSION: "1"
configFiles:
  Debug: Config/Secrets.xcconfig
  Release: Config/Secrets.xcconfig
packages:
  TrafikverketKit:
    path: Packages/TrafikverketKit
targets:
  Tagradar:
    type: application
    platform: iOS
    supportedDestinations: [iOS, iPadOS]
    sources:
      - path: Tagradar
        excludes:
          - "**/.DS_Store"
          - "AppIcon.icon/**"
      # Icon Composer package; Xcode compiles every appearance (default, dark, clear, tinted) from it.
      - path: Tagradar/AppIcon.icon
        type: file
        buildPhase: resources
    dependencies:
      - package: TrafikverketKit
      - target: TagradarWidgets
    entitlements:
      path: Tagradar/Tagradar.entitlements
      properties:
        com.apple.security.application-groups: ["group.$(TAGRADAR_BUNDLE_ID)"]
        keychain-access-groups: ["$(AppIdentifierPrefix)$(TAGRADAR_BUNDLE_ID)"]
    info:
      path: Tagradar/Info.plist
      properties:
        CFBundleDisplayName: Tågradar
        CFBundleName: Tagradar
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, sv]
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        ITSAppUsesNonExemptEncryption: false
        # Source strings; the Swedish ones live in Tagradar/Resources/InfoPlist.xcstrings, like
        # every other user-facing string in the app.
        NSLocationWhenInUseUsageDescription: "Tågradar uses your location to centre the map and show trains near you."
        NSMicrophoneUsageDescription: "The microphone is used to search for trains and stations with your voice."
        NSSpeechRecognitionUsageDescription: "Speech recognition is used to search for trains and stations with your voice."
        UIBackgroundModes: [fetch]
        BGTaskSchedulerPermittedIdentifiers: ["$(TAGRADAR_BUNDLE_ID).refresh"]
        TagradarAppGroup: "group.$(TAGRADAR_BUNDLE_ID)"
        TagradarKeychainGroup: "$(AppIdentifierPrefix)$(TAGRADAR_BUNDLE_ID)"
        NSSupportsLiveActivities: true
        NSSupportsLiveActivitiesFrequentUpdates: false
        AppIdentifierPrefix: "$(AppIdentifierPrefix)"
        CFBundleURLTypes:
          - CFBundleURLName: "$(TAGRADAR_BUNDLE_ID)"
            CFBundleURLSchemes: [tagradar]
        TRVAPIKey: "$(TRV_API_KEY)"
        TRVAPIKeyRegistrationURL: "https://data.trafikverket.se"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(TAGRADAR_BUNDLE_ID)"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UISupportsDocumentBrowser: NO
        SWIFT_OBJC_BRIDGING_HEADER: ""
        ENABLE_PREVIEWS: YES
        DEVELOPMENT_ASSET_PATHS: "Tagradar/Preview\\ Content"
  TagradarWidgets:
    type: app-extension
    platform: iOS
    supportedDestinations: [iOS, iPadOS]
    sources:
      - path: TagradarWidgets
        excludes:
          - "**/.DS_Store"
      # Shared with the app. Each target compiles its own copy.
      - path: Tagradar/Models
      - path: Tagradar/Services/TrainService.swift
      - path: Tagradar/Support/APIKeyStore.swift
      - path: Tagradar/Support/Formatters.swift
      - path: Tagradar/Support/Keychain.swift
      - path: Tagradar/Support/SharedStorage.swift
      - path: Tagradar/Support/StationNames.swift
      - path: Tagradar/Views/Components/DelayBadge.swift
      - path: Tagradar/Views/Components/TrackChip.swift
      - path: Tagradar/Resources/Localizable.xcstrings
      # The extension is its own binary, so it needs its own declaration of the required-reason
      # APIs it uses — SharedStorage above reaches UserDefaults through the App Group.
      - path: Tagradar/Resources/PrivacyInfo.xcprivacy
    dependencies:
      - package: TrafikverketKit
      # Explicit links so the App Intents metadata processor runs for the widget configuration intents.
      - sdk: AppIntents.framework
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
      - sdk: ActivityKit.framework
    entitlements:
      path: TagradarWidgets/TagradarWidgets.entitlements
      properties:
        com.apple.security.application-groups: ["group.$(TAGRADAR_BUNDLE_ID)"]
        keychain-access-groups: ["$(AppIdentifierPrefix)$(TAGRADAR_BUNDLE_ID)"]
    info:
      path: TagradarWidgets/Info.plist
      properties:
        CFBundleDisplayName: Tågradar
        CFBundleName: TagradarWidgets
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, sv]
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        TRVAPIKey: "$(TRV_API_KEY)"
        AppIdentifierPrefix: "$(AppIdentifierPrefix)"
        # SharedStorage reads these from whichever bundle it is running in. Without them the
        # extension falls back to the release identifiers and, on any other team, looks for a group
        # its entitlements do not grant — so it sees none of the app's saved trains or station cache.
        TagradarAppGroup: "group.$(TAGRADAR_BUNDLE_ID)"
        TagradarKeychainGroup: "$(AppIdentifierPrefix)$(TAGRADAR_BUNDLE_ID)"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(TAGRADAR_BUNDLE_ID).widgets"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_WIDGET_BACKGROUND_COLOR_NAME: WidgetBackground
        SKIP_INSTALL: YES
  TagradarTests:
    type: bundle.unit-test
    platform: iOS
    sources: [TagradarTests]
    dependencies:
      - target: Tagradar
      - package: TrafikverketKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(TAGRADAR_BUNDLE_ID).tests"
        GENERATE_INFOPLIST_FILE: YES
  TagradarUITests:
    type: bundle.ui-testing
    platform: iOS
    supportedDestinations: [iOS, iPadOS]
    sources: [TagradarUITests]
    dependencies:
      - target: Tagradar
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(TAGRADAR_BUNDLE_ID).uitests"
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Tagradar:
    build:
      targets:
        Tagradar: all
        TagradarWidgets: all
        TagradarTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - TagradarTests
        - package: TrafikverketKit/TrafikverketKitTests
    archive:
      config: Release
  # Rotates the running app and checks the selection and the iPad sidebar survive it. Kept out of
  # the Tagradar scheme so CI's test run stays fast and offline-safe; it needs live train data.
  TagradarUITests:
    build:
      targets:
        Tagradar: all
        TagradarUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - TagradarUITests
