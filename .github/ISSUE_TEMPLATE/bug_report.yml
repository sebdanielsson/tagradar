name: Bug report
description: Something is not working
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: input
    id: train
    attributes:
      label: Train number and date (if relevant)
      placeholder: "520, 2026-09-02"
  - type: input
    id: device
    attributes:
      label: Device and iOS version
      placeholder: "iPhone 17 Pro, iOS 26.5"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
