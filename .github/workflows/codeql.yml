# CodeQL code scanning — advanced setup, because Swift needs a custom build. Swift analysis is
# currently off; see the matrix below.
#
# Swift is a compiled language: CodeQL only sees the code an actual compiler run touches. The Xcode
# project is generated by XcodeGen and never committed, so `autobuild` (what default setup runs)
# finds no .xcodeproj, falls back to `swift build` in Packages/TrafikverketKit and analyses 18 files
# — none of the app or the widget extension. This workflow generates the project first and builds
# the Tagradar scheme itself, so the whole codebase ends up in the database.
#
# Advanced setup replaces default setup: disable "CodeQL analysis" under Settings → Advanced
# Security (or "Switch to advanced"), otherwise these uploads are rejected. actions, python and
# javascript-typescript (the push server) use buildless analysis.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, like default setup ran it, so the scheduled scan also picks up new queries.
    - cron: "17 4 * * 1"
  workflow_dispatch:

# A new push to a pull request cancels the run still going for the previous one. Pushes to main are
# keyed by commit instead, so every commit on main is analysed — a shared group would drop the middle
# commit of a quick series, because only one run per group can sit pending.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # Swift is off until CodeQL supports Xcode 27's compiler: CodeQL 2.27 stops at Swift 6.3
          # (Xcode 26), and the app now uses iOS 27.1 SDK APIs (iPhone Duo), which Xcode 26 cannot
          # compile. On the xcode-27 image's macOS 27.0 release CodeQL's build tracer also broke SwiftPM's
          # manifest sandbox ("Bad CPU type in executable" when spawning sandbox-exec). To re-enable, add
          # back the entry below with `runner: xcode-27`; the Swift steps further down are kept for it.
          #   - language: swift
          #     build-mode: manual
          #     runner: macos-26
          - language: actions
            build-mode: none
            runner: ubuntu-26.04-arm
          - language: python
            build-mode: none
            runner: ubuntu-26.04-arm
          # The push server in server/.
          - language: javascript-typescript
            build-mode: none
            runner: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install XcodeGen
        if: matrix.language == 'swift'
        run: brew install --quiet xcodegen

      # Same empty xcconfig as the verify job: no API key is needed to compile.
      - name: Generate project
        if: matrix.language == 'swift'
        run: |
          mkdir -p Config
          printf 'TRV_API_KEY =\nDEVELOPMENT_TEAM =\n' > Config/Secrets.xcconfig
          xcodegen generate --quiet

      - uses: github/codeql-action/init@v4.39.0
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      # Everything CodeQL sees for Swift comes out of this build: the app, the widget extension and
      # TrafikverketKit. Debug build for the simulator, no signing, no tests. The destination is
      # generic on purpose — nothing here needs a concrete simulator device to exist.
      - name: Build
        if: matrix.build-mode == 'manual'
        run: |
          set -o pipefail
          xcodebuild -project Tagradar.xcodeproj -scheme Tagradar \
            -destination 'generic/platform=iOS Simulator' \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO build | xcbeautify --renderer github-actions

      - uses: github/codeql-action/analyze@v4.39.0
        with:
          category: /language:${{ matrix.language }}
