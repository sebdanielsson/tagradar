# One workflow for everything:
#   verify          lint, format, tests and a simulator build on every push and pull request
#   testflight      Release archive uploaded to TestFlight on every push to main (and on demand)
#   release-please  opens or updates the release PR from Conventional Commits; creates the tag and
#                   GitHub release when that PR is merged
#   appstore        right after a release was created: archive, upload, push metadata and
#                   screenshots, submit for review
# Setup, secrets and the release flow: docs/release.md
name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      testflight:
        description: Upload a TestFlight build from this ref
        type: boolean
        default: true

# A new push to a pull request cancels the run still going for the previous one. Pushes to main are
# keyed by commit instead, so each one gets its own group and none is ever cancelled — a shared group
# would drop the middle commit of a quick series, because only one run per group can sit pending.
# The TestFlight and App Store jobs keep their own groups, so uploads still happen one at a time.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1

      # Independent checks share one runner instead of three. SwiftFormat and xcbeautify are preinstalled on
      # the xcode-27 image; SwiftLint and XcodeGen are not.
      - parallel:
          - name: SwiftFormat (check only)
            run: swiftformat --lint .
          - name: SwiftLint
            run: |
              brew install --quiet swiftlint
              swiftlint --strict --reporter github-actions-logging
          - name: Install XcodeGen
            run: brew install --quiet xcodegen

      - name: TrafikverketKit tests
        id: kit-tests
        background: true
        run: swift test --package-path Packages/TrafikverketKit

      - name: Generate project
        run: |
          mkdir -p Config
          printf 'TRV_API_KEY =\nDEVELOPMENT_TEAM =\n' > Config/Secrets.xcconfig
          xcodegen generate --quiet

      # The destination is resolved at run time: naming the simulator fails at random on runners
      # whose CoreSimulator has not registered its device set yet (Scripts/ci/simulator-destination.sh).
      - name: Build and test app
        run: |
          set -o pipefail
          destination=$(Scripts/ci/simulator-destination.sh)
          : "${destination:?simulator-destination.sh printed no destination}"
          echo "Destination: $destination"
          xcodebuild -project Tagradar.xcodeproj -scheme Tagradar \
            -destination "$destination" \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO build test | xcbeautify --renderer github-actions

      - name: TrafikverketKit tests (result)
        wait: [kit-tests]

  testflight:
    name: TestFlight
    needs: verify
    if: >-
      github.repository == 'sebdanielsson/tagradar' &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/main') ||
       (github.event_name == 'workflow_dispatch' && inputs.testflight))
    runs-on: xcode-27
    timeout-minutes: 60
    environment: testflight
    concurrency:
      group: testflight-upload
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install XcodeGen
        run: brew install --quiet xcodegen

      - name: Generate project
        env:
          TRV_API_KEY: ${{ secrets.TRV_API_KEY }}
          DEVELOPMENT_TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          mkdir -p Config
          printf 'TRV_API_KEY = %s\nDEVELOPMENT_TEAM = %s\n' "$TRV_API_KEY" "$DEVELOPMENT_TEAM" > Config/Secrets.xcconfig
          xcodegen generate --quiet

      - name: Write App Store Connect API key
        env:
          ASC_KEY: ${{ secrets.APP_STORE_CONNECT_KEY_BASE64 }}
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        run: Scripts/ci/write-asc-key.sh

      # Cloud-managed signing: Xcode creates provisioning profiles through the API key, so no
      # profile is stored in GitHub. Both the distribution and development certificates are pinned
      # (imported below) rather than left to cloud-managed signing to mint fresh each run —
      # GitHub-hosted runners are ephemeral, so without pinned identities every run would ask Apple
      # for new certificates and eventually exhaust the account's certificate limit. Archiving the
      # Release configuration alone isn't enough to avoid this: -allowProvisioningUpdates syncs
      # every signing style referenced in the project, including the Development one the Debug
      # configuration uses (docs/release.md).
      - name: Import signing certificate
        env:
          DISTRIBUTION_CERTIFICATE_P12_BASE64: ${{ secrets.DISTRIBUTION_CERTIFICATE_P12_BASE64 }}
          DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.DISTRIBUTION_CERTIFICATE_PASSWORD }}
          DEVELOPMENT_CERTIFICATE_P12_BASE64: ${{ secrets.DEVELOPMENT_CERTIFICATE_P12_BASE64 }}
          DEVELOPMENT_CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPMENT_CERTIFICATE_PASSWORD }}
        run: Scripts/ci/import-signing-certificate.sh

      - name: Archive
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -o pipefail
          xcodebuild archive \
            -project Tagradar.xcodeproj -scheme Tagradar -configuration Release \
            -archivePath "$RUNNER_TEMP/Tagradar.xcarchive" \
            -destination 'generic/platform=iOS' \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            MARKETING_VERSION="$(cat version.txt)" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" | xcbeautify --renderer github-actions

      - name: Export and upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Tagradar.xcarchive" \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          echo "Uploaded Tågradar $(cat version.txt) (build ${{ github.run_number }}) to TestFlight." >> "$GITHUB_STEP_SUMMARY"

  release-please:
    name: Release PR
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
      body: ${{ steps.release.outputs.body }}
    steps:
      - uses: googleapis/release-please-action@v5.0.0
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  appstore:
    name: App Store
    needs: [verify, release-please]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: xcode-27
    timeout-minutes: 90
    environment: app-store
    concurrency:
      group: appstore-submit
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Install XcodeGen
        run: brew install --quiet xcodegen

      - name: Generate project
        env:
          TRV_API_KEY: ${{ secrets.TRV_API_KEY }}
          DEVELOPMENT_TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          mkdir -p Config
          printf 'TRV_API_KEY = %s\nDEVELOPMENT_TEAM = %s\n' "$TRV_API_KEY" "$DEVELOPMENT_TEAM" > Config/Secrets.xcconfig
          xcodegen generate --quiet

      - name: Write App Store Connect API key
        env:
          ASC_KEY: ${{ secrets.APP_STORE_CONNECT_KEY_BASE64 }}
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        run: Scripts/ci/write-asc-key.sh

      # Pinned distribution and development certificates — see the testflight job above and docs/release.md.
      - name: Import signing certificate
        env:
          DISTRIBUTION_CERTIFICATE_P12_BASE64: ${{ secrets.DISTRIBUTION_CERTIFICATE_P12_BASE64 }}
          DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.DISTRIBUTION_CERTIFICATE_PASSWORD }}
          DEVELOPMENT_CERTIFICATE_P12_BASE64: ${{ secrets.DEVELOPMENT_CERTIFICATE_P12_BASE64 }}
          DEVELOPMENT_CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPMENT_CERTIFICATE_PASSWORD }}
        run: Scripts/ci/import-signing-certificate.sh

      # The release commit is also a push to main, so the testflight job in this same run uploads this
      # version too, as build <run_number>, in parallel with this job. App Store Connect rejects a second
      # upload with the same version and build (ITMS-90189), whichever lands first, so this job appends
      # the run attempt: 202 → 202.1, which stays unique on a re-run (202.2) and still sorts below the
      # next run's TestFlight build (203).
      - name: Archive
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          VERSION: ${{ needs.release-please.outputs.version }}
          BUILD_NUMBER: ${{ github.run_number }}.${{ github.run_attempt }}
        run: |
          set -o pipefail
          xcodebuild archive \
            -project Tagradar.xcodeproj -scheme Tagradar -configuration Release \
            -archivePath "$RUNNER_TEMP/Tagradar.xcarchive" \
            -destination 'generic/platform=iOS' \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" | xcbeautify --renderer github-actions

      - name: Export .ipa
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Tagradar.xcarchive" \
            -exportOptionsPlist ExportOptions-export.plist \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          ls "$RUNNER_TEMP/export"

      - name: Release notes from the GitHub release
        env:
          BODY: ${{ needs.release-please.outputs.body }}
        run: Scripts/ci/release-notes.sh

      - name: Upload to App Store Connect and submit for review
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_KEY_BASE64 }}
          FASTLANE_SKIP_UPDATE_CHECK: "1"
          FASTLANE_HIDE_CHANGELOG: "1"
          VERSION: ${{ needs.release-please.outputs.version }}
        run: fastlane release ipa:"$RUNNER_TEMP/export/Tagradar.ipa" version:"$VERSION"

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: Tagradar-${{ needs.release-please.outputs.tag_name }}
          path: |
            ${{ runner.temp }}/export/*.ipa
            ${{ runner.temp }}/Tagradar.xcarchive/dSYMs
          retention-days: 90
          if-no-files-found: warn

      - name: Summary
        env:
          VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          echo "Tågradar $VERSION (build ${{ github.run_number }}.${{ github.run_attempt }}) uploaded and submitted for review. Release it in App Store Connect once approved." >> "$GITHUB_STEP_SUMMARY"
