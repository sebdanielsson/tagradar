[project]
name = "rail-network"
version = "0"
description = "Offline pipeline turning Trafikverket's NJDB GeoPackage into Tagradar's bundled RailNetwork.json"
requires-python = ">=3.14.7"
dependencies = ["networkx>=3.7", "pyproj>=3.8.0", "shapely>=2.1"]

# Scripts, not a package: `uv run build_graph.py` sets up the environment from this file.
[tool.uv]
package = false
